name: release-binaries
run-name: Lichii Build 410 Ocarina movie sync preview for Windows

on:
  push:
    branches: ['build/ocarina-movie-sync-410-windows']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile, test and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      matrix:
        platform: [windows-x86_64]
    env:
      LICHII_USE_PENDING_RELEASE_NOTES: 'OFF'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3000M
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up MSVC
        if: startsWith(matrix.platform, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt on Windows
        if: startsWith(matrix.platform, 'windows')
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts qtimageformats
          cache: true

      - name: Install ccache on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Verify Vulkan tools on Windows
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: glslangValidator --version

      - name: Restore CPM downloads
        id: cpm-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/cpm
          key: cpm-${{ matrix.platform }}-v2-${{ hashFiles('cpmfile.json', 'CMakeLists.txt', 'CMakeModules/CPM*.cmake', 'externals/**/CMakeLists.txt', 'src/**/CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ matrix.platform }}-v2-
            cpm-${{ runner.os }}-

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .ccache
            .lto-cache
          # The profile's hash is part of the key, so objects built against an older profile are
          # never restored.
          key: objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-${{ github.sha }}-
            objects-${{ matrix.platform }}${{ matrix.profile && format('-{0}', hashFiles(matrix.profile)) || '' }}-v3-

      - name: Configure Windows
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: |
          set -euo pipefail
          flags="-DWIN32 -D_WINDOWS -DNOMINMAX -flto=thin"
          if [ -n '${{ matrix.profile }}' ]; then
            flags+=" -fprofile-use=$(cygpath -m "$PWD/${{ matrix.profile }}")"
            flags+=" -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
            flags+=" -Wno-error=backend-plugin"
          fi
          # The ThinLTO backend runs at link time, which ccache doesn't cover; lld caches each
          # module's native code, so a link only recompiles the modules that changed. One build's
          # entries take 1.3 GB.
          lto_cache="/lldltocache:$(cygpath -m "$PWD/.lto-cache") /lldltocachepolicy:cache_size_bytes=1500m"
          aftermath=()
          if [ '${{ inputs.nsight_aftermath }}' = true ]; then
            aftermath=(-DENABLE_NSIGHT_AFTERMATH=ON)
          fi
          cmake -S . -B build/release -G Ninja "${aftermath[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DLICHII_TESTS=ON \
            -DLICHII_CMD=ON \
            -DLICHII_ROOM=OFF \
            -DLICHII_ROOM_STANDALONE=OFF \
            -DLICHII_USE_BUNDLED_QT=OFF \
            -DENABLE_FLYHIGH=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DLICHII_USE_BUNDLED_SDL3=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DLICHII_BUILD_TAG=build-410-oot-sync.1 \
            "-DLICHII_USE_PENDING_RELEASE_NOTES=$LICHII_USE_PENDING_RELEASE_NOTES" \
            -DLICHII_BUILD_PLATFORM=${{ matrix.platform }} \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON \
            "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe" \
            "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe" \
            "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe" \
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded \
            "-DCMAKE_EXE_LINKER_FLAGS=/DEBUG:FULL /OPT:REF /OPT:ICF $lto_cache" \
            "-DCMAKE_C_FLAGS=$flags" \
            "-DCMAKE_CXX_FLAGS=-EHsc $flags"

      - name: Build
        shell: bash
        env:
          CCACHE_COMPILERCHECK: ${{ startsWith(matrix.platform, 'windows') && format('string:{0}', hashFiles('tools/windows/install-llvm.ps1')) || 'content' }}
        run: |
          ccache --zero-stats
          start=$(date +%s)
          targets="lichii lichii-cmd"
          if [[ "${{ matrix.platform }}" == windows* ]]; then targets="$targets lichii-updater"; fi
          cmake --build build/release --target $targets --parallel
          ccache --show-stats
          ccache --evict-older-than "$(( $(date +%s) - start + 60 ))s"
          du -sh .ccache .lto-cache 2> /dev/null || true

      - name: Run movie clock regression tests on Windows
        shell: pwsh
        run: |
          cmake --build build/release --target tests --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./build/release/bin/tests.exe '[nx2_movie_clock]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item build/release/bin/tests.exe $env:RUNNER_TEMP

      - name: Package Windows binary
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($file in 'lichii.exe', 'eden-cli.exe', 'flyhigh.dll', 'licenses/flyhigh/LICENSE', 'licenses/flyhigh/NOTICE') {
            if (-not (Test-Path "build/release/bin/$file" -PathType Leaf)) {
              throw "build/release/bin/$file was not produced"
            }
          }
          # Symbols ship as their own artifact, not in the release zip.
          New-Item -ItemType Directory -Force build/release/symbols | Out-Null
          Move-Item build/release/bin/*.pdb build/release/symbols/
          windeployqt --release --no-translations build/release/bin/lichii.exe
          if (Get-ChildItem -Recurse build/release/bin -Filter 'GFSDK_*') {
            throw 'build/release/bin holds Nsight Aftermath files, which must not ship'
          }
          $excluded = 'flyhighfg.bin', 'flyhighfg.json', 'graph.json', 'models.json', 'WEIGHTS_LICENSE.md'
          $unshippable = Get-ChildItem -Recurse -File build/release/bin | Where-Object { $_.Name -in $excluded }
          if ($unshippable) {
            throw "build/release/bin holds FlyHigh model files, which must not ship: $($unshippable.FullName -join ', ')"
          }

      - name: Check the packaged Windows loader
        shell: pwsh
        working-directory: build/release/bin
        run: |
          $env:SDL_AUDIODRIVER = 'dummy'
          $env:SDL_VIDEODRIVER = 'dummy'
          & ./eden-cli.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows binary
        if: startsWith(matrix.platform, 'windows')
        uses: actions/upload-artifact@v7
        with:
          name: Lichii-410-Ocarina-Sync-Windows-x64
          path: build/release/bin/
          if-no-files-found: error
          retention-days: 30
